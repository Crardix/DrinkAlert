name: Build DrinkAlert APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o DrinkAlert_MVP_0.1.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project/DrinkAlert
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkAlert-debug
          path: project/DrinkAlert/app/build/outputs/apk/debug/app-debug.apk
